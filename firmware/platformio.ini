; PlatformIO project for the occupancy-grid-compression firmware.
; Two environments build the *same* source with a different role selected
; via build_flags -- flash `rover` to the rover's ESP32, `base` to the
; base-station's ESP32. Both roles send AND receive (grid rover->base,
; movement instructions base->rover), hence "rover/base" rather than the
; earlier one-directional "sender/receiver" naming.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
; Regenerates lib/occupancy_grid_lib/ from the canonical ../include and
; ../src before every build, instead of that being a hand-maintained copy.
extra_scripts = pre:sync_lib.py
; Explicit standard -- the ESP32 toolchain's default C++ mode rejected
; aggregate-init on a struct with a default member initializer
; (SymbolStream), which the host build's newer-GCC default handled fine.
; Pin this so firmware and host code assume the same language rules.
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
; Exclude the standalone hardware-test sketches below from the normal
; rover/base builds (they each define their own setup()/loop(), which would
; collide with main.cpp's if compiled together).
build_src_filter = +<*> -<lora_test/>

[env:rover]
build_flags =
    ${env.build_flags}
    -D DEVICE_ROLE_ROVER

[env:base]
build_flags =
    ${env.build_flags}
    -D DEVICE_ROLE_BASE

; Standalone LoRa hardware tests -- bypass this project's protocol entirely,
; just raw send/receive via the vendor LoRa library's own examples, to check
; whether the two radios can hear each other at all. See src/lora_test/.
[env:lora_test_sender]
build_src_filter = +<lora_test/sender_main.cpp>

[env:lora_test_receiver]
build_src_filter = +<lora_test/receiver_main.cpp>
